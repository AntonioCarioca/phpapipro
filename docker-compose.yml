services:
  web:
    image: nginx:1.28.0
    container_name: phpapipro_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - .:/phpapipro
    depends_on:
      - php
    restart: unless-stopped
    networks:
      - frontend

  php:
    build:
      context: .
      dockerfile: docker/php/PHP.Dockerfile
    container_name: phpapipro_php
    volumes:
      - .:/phpapipro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  db:
    image: mariadb:10.11.13
    container_name: phpapipro_db
    env_file:
      - .env
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge